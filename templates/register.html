<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
</head>
<body>
    <h2>Регистрация</h2>
    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/register">
        <label for="username"><span>Имя пользователя</span></label>
        <input type="text" id="username" name="username" required minlength="3" maxlength="30">

        <label for="password"><span>Пароль</span></label>
        <input type="password" id="password" name="password">

        <label for="confirm_password"><span>Подтверждение пароля</span></label>
        <input type="password" id="confirm_password" name="confirm_password">

        <button type="submit">Создать аккаунт</button>
    </form>
</body>
</html>
