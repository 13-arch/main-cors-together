<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quiz System</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style_quiz.css') }}">
  
  <script>
    const CURRENT_USER = "{{ username }}";
    const CURRENT_ROLE = "{{ role }}";
  </script>
</head>
<body>

  <div id="block1" class="card" style="display:block;">
    <h1>Викторина</h1>
    <p>Пользователь: <b>{{ username }}</b></p>
    
    <div class="menu-section">
        <h3>Выберите тему:</h3>
        <div id="topics-list" class="topics-grid">
            <p>Загрузка...</p>
        </div>
    </div>

    <hr>
    
    <div id="admin-controls" style="display:none;">
        <p>Панель управления:</p>
        <button id="add_topic_btn" class="btn-admin">➕ Создать / Дополнить тест</button>
        <button id="results_but" class="btn-admin">📊 Результаты учеников</button>
    </div>

    <br>
    <a href="/home" class="link-back">Вернуться в профиль</a>
  </div>

  <div id="block2" class="card" style="display:none;">
    <div id="progress-container"><div id="progress-bar"></div></div>
    <p id="progress-text"></p>
    <p id="quest1">Загрузка...</p>
    <div class="answers">
      <button class="answer" data-index="0"></button>
      <button class="answer" data-index="1"></button>
      <button class="answer" data-index="2"></button>
      <button class="answer" data-index="3"></button>
    </div>
  </div>

  <div id="block3" class="card" style="display:none;">
    <h1>Тест завершен!</h1>
    <div class="score-circle">
        <span id="final-score-val">0</span>
    </div>
    <p id="final-score-text"></p>  
    <button id="back-to-menu">В главное меню</button>
    <a href="/home" class="link-back">Вернуться в профиль</a>
  </div>

  <div id="addForm" class="card wide-card" style="display:none;">
    <h2>Конструктор тестов</h2>
    
    <div class="form-group">
        <label>Название темы (существующей или новой):</label>
        <input type="text" id="topicNameInput" placeholder="Например: Математика" list="topics-datalist">
        <datalist id="topics-datalist"></datalist>
    </div>

    <div id="new-questions-container">
        </div>

    <div class="admin-actions">
        <button id="add-block-btn" style="background: #2196F3;">+ Добавить еще вопрос</button>
        <div class="spacer"></div>
        <button id="saveAllBtn" style="background: #4CAF50;">Сохранить всё</button>
        <button id="cancelAdd" style="background: #f44336;">Отмена</button>
    </div>
  </div>

  <div id="resultsBlock" class="card wide-card" style="display:none;">
    <h2>Результаты студентов</h2>
    <div class="results-table-container">
      <table id="resultsTable" border="1" style="width:100%">
        <thead>
          <tr>
            <th>Пользователь</th>
            <th>Тема</th>
            <th>Счет</th>
            <th>Дата</th>
          </tr>
        </thead>
        <tbody id="resultsTableBody">
          </tbody>
      </table>
    </div>
    <button id="closeResults">Закрыть</button>
  </div>

  <script src="{{ url_for('static', path='pract.js') }}"></script>
</body>
</html>
