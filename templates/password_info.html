<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Форма для FastAPI</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 540px;
            margin: 40px auto;
        }

        label {
            display: block;
            margin: 8px 0;
        }

        .group {
            margin: 16px 0;
        }

        button {
            margin-top: 16px;
        }
    </style>
</head>

<body>
    <h1>Форма</h1>
    <p>{{ answer }}</p>
    <form method="POST" action="/password_info">
        <label>
            Минимальное количество символов для пароля:
            <input type="text" name="min_symbols"
                {% if min_symbols is string and min_symbols == "Ввод" %}
                    placeholder="{{ min_symbols }}"
                {% else %}
                    value="{{ min_symbols }}"
                {% endif %}
                required
            />
        </label>

        <div class="group">
            <strong>Опции:</strong>
            <label>
                <input type="checkbox" name="digits" value="yes" {% if digits == 'yes' %}checked{% endif %} /> Цифры
            </label>
            <label>
                <input type="checkbox" name="symbols" value="yes" {% if symbols == 'yes' %}checked{% endif %} /> Спец
                символы
            </label>
            <label>
                <input type="checkbox" name="lower_letters" value="yes" {% if lower_letters == 'yes' %}checked{% endif
                    %} /> Маленькие символы
            </label>
            <label>
                <input type="checkbox" name="upper_letters" value="yes" {% if upper_letters == 'yes' %}checked{% endif
                    %} /> Большие символы
            </label>
        </div>

        <button type="submit">Записать</button>
    </form>
</body>

</html>
